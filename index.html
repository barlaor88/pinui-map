<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>איתור מתחמים</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --card:#f4f4f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --muted:#aaa; --card:#222; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  #login { max-width:320px; margin:80px auto; padding:0 16px; display:flex; flex-direction:column; gap:8px; }
  #login input,#login button { padding:10px; font-size:16px; }
  #app { display:none; height:100%; flex-direction:column; }
  #bar { padding:8px 16px; background:var(--card); font-size:14px; }
  #map { flex:1; }
  .legend span { display:inline-block; width:12px; height:12px; margin-inline:8px 4px; vertical-align:middle; }
  #tabs button { padding:6px 12px; margin-inline-end:6px; }
  #table { display:none; flex:1; overflow:auto; padding:0 16px 16px; }
  #table table { border-collapse:collapse; width:100%; font-size:14px; }
  #table th, #table td { border-bottom:1px solid var(--card); padding:6px; text-align:start; vertical-align:top; }
</style>
</head>
<body>
<div id="login">
  <h2>כניסה</h2>
  <input id="email" type="email" placeholder="מייל" autocomplete="username">
  <input id="pw" type="password" placeholder="סיסמה" autocomplete="current-password">
  <button id="go">כניסה</button>
  <a href="#" id="forgot">שכחתי סיסמה</a>
  <div id="err" style="color:#c00"></div>
</div>
<div id="pwbox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:2000">
  <div style="max-width:320px; margin:80px auto; padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:8px">
    <h3 style="margin:0">קביעת סיסמה</h3>
    <input id="pw1" type="password" placeholder="סיסמה חדשה" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="שוב, לאימות" autocomplete="new-password">
    <button id="pwsave">שמירה</button>
    <button id="pwcancel">ביטול</button>
    <div id="pwmsg"></div>
  </div>
</div>
<div id="app">
  <div id="bar"><div style="float:left"><button id="setpw">קביעת סיסמה</button></div><div id="run"></div><div class="legend" id="legend"></div><div id="note" style="color:var(--muted)"></div>
    </div>
  <div id="map"></div>
  <div id="table"></div>
</div>
<script>
const sb = supabase.createClient("https://dqiivguyusktueioigpc.supabase.co", "sb_publishable_98oew8OXAF5ZoGVGmpAYfA_CJGe4nW3");
const NOTE = "פער ידוע: תכניות לפני שלב קיום תנאי סף, חתימות בלי תכנית, ותכניות ישנות שלא הוכרזו אינן במקורות. נבדקות בשטח. מתחמים בשלב גישוש, לפני תכנית, לא מופיעים במקורות. הם נתפסים רק בבדיקת הכפילות מול מה שבטיפולנו ובשטח.";
const COLORS = {"תפוסה":"#d62728","לבדיקה":"#ff9f1c","שימור":"#8c564b","התחדשות נקודתית":"#9467bd","פנויה":"#2ca02c"};
document.getElementById("go").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: email.value, password: pw.value });
  if (error) { err.textContent = "כניסה נכשלה"; return; }
  start();
};
let started = false;
sb.auth.onAuthStateChange((event) => { if (event === "PASSWORD_RECOVERY") showPw(); });
sb.auth.getSession().then(({ data }) => { if (data.session) start(); });
document.getElementById("forgot").onclick = async (e) => {
  e.preventDefault();
  if (!email.value) { err.textContent = "כתבו את המייל ואז לחצו שוב."; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email.value, { redirectTo: location.origin + location.pathname });
  err.textContent = error ? "השליחה נכשלה, נסו שוב מאוחר יותר." : "אם המייל רשום, נשלח אליו קישור לקביעת סיסמה.";
};
function showPw() { pwmsg.textContent = ""; pw1.value = pw2.value = ""; pwbox.style.display = "block"; }
document.getElementById("setpw").onclick = showPw;
pwcancel.onclick = () => { pwbox.style.display = "none"; };
pwsave.onclick = async () => {
  if (pw1.value.length < 8) { pwmsg.textContent = "לפחות 8 תווים."; return; }
  if (pw1.value !== pw2.value) { pwmsg.textContent = "הסיסמאות לא זהות."; return; }
  const { error } = await sb.auth.updateUser({ password: pw1.value });
  if (error) { pwmsg.textContent = "השמירה נכשלה."; return; }
  pwmsg.textContent = "הסיסמה נשמרה.";
  setTimeout(() => { pwbox.style.display = "none"; start(); }, 800);
};
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function start() {
  if (started) return; started = true;
  login.style.display = "none"; app.style.display = "flex";
  note.textContent = NOTE;
  legend.innerHTML = Object.entries(COLORS).map(([k,v]) => `<span style="background:${v}"></span>${k}`).join("");
  const { data: runs } = await sb.from("run_log").select("run_id,finished_at,notices").eq("status","הצליחה")
    .order("started_at", { ascending: false }).limit(1);
  if (!runs || !runs.length) { run.textContent = "אין עדיין ריצה תקינה, או שאין הרשאה."; return; }
  const r = runs[0];
  run.textContent = `ריצה תקינה אחרונה: ${new Date(r.finished_at).toLocaleString("he-IL")}`;
  if (r.notices && r.notices.length) {
    const n = document.createElement("div"); n.style.color = "#c00"; n.style.fontWeight = "600";
    n.textContent = r.notices.join(" "); bar.prepend(n);
  }
  const map = L.map("map").setView([32.145, 34.84], 14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "OpenStreetMap" }).addTo(map);
  // מקבצים קודם. חלקות רק מהגדלה 16 ומעלה (מדידה 18.11: שליפת החלקות 8.4 שניות). בלי הסיבות: נשלפות בלחיצה.
  const parcelLayer = L.geoJSON(null, {
    style: f => ({ color: COLORS[f.properties.grp], weight: 1, fillOpacity: 0.35 }),
    onEachFeature: (f, l) => l.on("click", async () => {
      const { data } = await sb.from("parcels_classified").select("reasons,yeud_str").eq("run_id", r.run_id)
        .eq("parcel_key", f.properties.parcel_key).limit(1);
      const x = (data && data[0]) || {};
      l.bindPopup(parcelPopup(f.properties, x, clusterOf[f.properties.parcel_key])).openPopup();
    })
  }).addTo(map);
  let parcelsLoaded = false;
  const clusterOf = {};
  const hint = document.createElement("div"); hint.style.color = "var(--muted)";
  hint.textContent = "להצגת החלקות: הגדילו את המפה."; bar.appendChild(hint);
  async function loadParcels() {
    if (parcelsLoaded || map.getZoom() < 16) return;
    parcelsLoaded = true; hint.textContent = "טוען חלקות...";
    const parcels = await pageAll("parcels_classified", "parcel_key,grp,yeud_note,geom_wgs84", r.run_id,
                                  q => q.neq("grp", "לא רלוונטית"));
    parcelLayer.addData(parcels.map(p => ({ type:"Feature", geometry:p.geom_wgs84, properties:p })));
    parcelLayer.bringToBack(); hint.textContent = "";
  }
  map.on("zoomend", loadParcels);
  const clusters = await pageAll("clusters", "cluster_id,area_dunam,apartments_est,flags,parcel_keys,geom_wgs84", r.run_id);
  for (const c of clusters) for (const k of c.parcel_keys) clusterOf[k] = c;
  L.geoJSON(clusters.map(c => ({ type:"Feature", geometry:c.geom_wgs84, properties:c })), {
    style: { color: "#0057b8", weight: 3, fill: false },
    onEachFeature: (f, l) => { const c = f.properties; l.bindPopup(`<b>${esc(c.cluster_id)}</b><br>${c.area_dunam} דונם, ${c.apartments_est} דירות (אומדן)<br>${esc((c.flags||[]).join(", "))}<br><small>${esc(c.parcel_keys.join(", "))}</small>`); }
  }).addTo(map);
  if (!window.tTable) return;  // גרסת מפה בלבד, בלי טבלה
  renderTable(clusters, r);
  tMap.onclick = () => { table.style.display = "none"; document.getElementById("map").style.display = "block"; map.invalidateSize(); };
  tTable.onclick = () => { document.getElementById("map").style.display = "none"; table.style.display = "block"; };
  tCsv.onclick = () => downloadCsv(clusters, r);
}
function reasonLine(group, x) {
  const parts = [x["סיבה"]];
  if (x["תכנית"]) parts.push(`תכנית ${x["תכנית"]}`);
  if (x["סטטוס"]) parts.push(x["סטטוס"]);
  if (x["ועדה"]) parts.push(`ועדה: ${x["ועדה"]}`);
  if (x["תאריך"]) parts.push(`אושרה ${x["תאריך"]}${x["הנחה"] ? " (הנחה)" : ""}`);
  if (x["יחס_חפיפה"] != null) parts.push(`חפיפה ${Math.round(x["יחס_חפיפה"] * 1000) / 10}%`);
  if (x["חפיפה_מר"] != null) parts.push(`${x["חפיפה_מר"]} מ"ר`);
  if (x["פירוט"]) parts.push(x["פירוט"]);
  if (x["מזהה"]) parts.push(x["מזהה"]);
  return `${group}: ${parts.filter(Boolean).join(", ")}`;
}
function parcelPopup(p, x, c) {
  const lines = [`<b>${esc(p.parcel_key)}</b>`, esc(p.grp)];
  if (x.yeud_str) lines.push(`ייעוד: ${esc(x.yeud_str)}`);
  if (p.yeud_note) lines.push(esc(p.yeud_note));
  const reasons = x.reasons || {};
  for (const [g, items] of Object.entries(reasons)) {
    if (g === "מידע") continue;
    for (const it of items) lines.push(esc(reasonLine(g, it)));
  }
  for (const it of (reasons["מידע"] || [])) lines.push(`<i>${esc(it["שורה"] || it["סיבה"])}</i>`);
  if (c) {
    const fl = (c.flags || []).join(", ");
    lines.push(`<b>מקבץ ${esc(c.cluster_id)}</b>: ${c.area_dunam} דונם, ${c.apartments_est} דירות (אומדן, הנחה)${fl ? ", " + esc(fl) : ""}`);
  }
  return lines.join("<br>");
}
const COLS = [["cluster_id","מקבץ"],["area_dunam","שטח (דונם)"],["apartments_est","דירות (אומדן)"],["flags","סימונים"],["parcel_keys","גוש-חלקה"]];
function renderTable(cs, r) {
  const rows = cs.map(c => "<tr>" + COLS.map(([k]) => `<td>${esc(Array.isArray(c[k]) ? c[k].join(", ") : c[k])}</td>`).join("") + "</tr>").join("");
  table.innerHTML = `<p>${cs.length} מקבצים. גודל דירה טיפוסי הוא הנחה. ${esc(NOTE)}</p><table><thead><tr>${COLS.map(c => `<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`;
}
function downloadCsv(cs, r) {
  const q = v => '"' + String(Array.isArray(v) ? v.join("; ") : (v ?? "")).replace(/"/g, '""') + '"';
  const csv = "\ufeff" + ["# " + NOTE, COLS.map(c => q(c[1])).join(","), ...cs.map(c => COLS.map(([k]) => q(c[k])).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `clusters_${r.run_id}.csv`; a.click();
}
async function pageAll(table, cols, runId, extra) {
  let out = [], from = 0;
  for (;;) {
    let q = sb.from(table).select(cols).eq("run_id", runId);
    if (extra) q = extra(q);
    const { data, error } = await q.order(table === "clusters" ? "cluster_id" : "parcel_key").range(from, from + 999);
    if (error || !data) break;
    out = out.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}
</script>
</body>
</html>
